<!DOCTYPE html>
<!--
  Source for og-image.png (1200x630 social preview).
  Regenerate with: npm run og-image (needs Playwright + Chromium installed).
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      color: #f1f5f9;
      background: #020617;
      position: relative;
    }
    .glow { position: absolute; border-radius: 50%; filter: blur(110px); }
    .glow.a { width: 520px; height: 520px; background: rgba(99, 102, 241, 0.35); top: -180px; left: -140px; }
    .glow.b { width: 460px; height: 460px; background: rgba(16, 185, 129, 0.18); bottom: -200px; right: -60px; }

    .wrap {
      position: relative;
      height: 100%;
      padding: 72px 80px;
      display: flex;
      align-items: center;
      gap: 64px;
    }
    .left { flex: 1; }

    .brand { display: flex; align-items: center; gap: 18px; }
    .logo {
      width: 64px; height: 64px; border-radius: 18px; padding: 3px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #10b981);
    }
    .logo div {
      width: 100%; height: 100%; border-radius: 15px; background: #0f172a;
      display: flex; align-items: center; justify-content: center;
    }
    .brand span { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }

    h1 {
      margin-top: 44px;
      font-size: 76px;
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -0.035em;
    }
    h1 em {
      font-style: normal;
      background: linear-gradient(90deg, #6366f1, #a855f7, #10b981);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.sub {
      margin-top: 26px;
      font-size: 27px;
      font-weight: 500;
      color: #94a3b8;
      line-height: 1.35;
    }
    .pills { margin-top: 34px; display: flex; gap: 12px; }
    .pill {
      font-size: 19px; font-weight: 600; color: #a5b4fc;
      padding: 8px 18px; border-radius: 999px;
      background: rgba(99, 102, 241, 0.12); border: 1.5px solid rgba(99, 102, 241, 0.3);
    }

    .card {
      width: 380px;
      padding: 34px 32px;
      border-radius: 32px;
      background: #0f172a;
      border: 1.5px solid #1e293b;
      box-shadow: 0 30px 80px rgba(99, 102, 241, 0.18);
    }
    .card .label { font-size: 15px; font-weight: 600; letter-spacing: 0.1em; color: #64748b; }
    .card .kcal { margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 700; }
    .card .kcal small { font-family: 'Inter', sans-serif; font-size: 18px; color: #64748b; font-weight: 500; }
    .rings { margin-top: 28px; display: flex; justify-content: space-between; }
    .ring { text-align: center; }
    .ring svg { width: 96px; height: 96px; transform: rotate(-90deg); }
    .ring .v { margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600; }
    .ring .n { margin-top: 2px; font-size: 15px; font-weight: 600; }
    .water { margin-top: 30px; }
    .water .row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; color: #cbd5e1; }
    .water .row b { font-family: 'JetBrains Mono', monospace; color: #38bdf8; }
    .bar { margin-top: 10px; height: 10px; border-radius: 999px; background: #1e293b; overflow: hidden; }
    .bar div { width: 75%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #38bdf8, #2563eb); }
  </style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>

  <div class="wrap">
    <div class="left">
      <div class="brand">
        <div class="logo"><div>
          <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#818cf8" stroke-width="2.4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div></div>
        <span>MacroPulse</span>
      </div>

      <h1>Hit your macros,<br><em>every meal.</em></h1>
      <p class="sub">TDEE &amp; macro calculator, meal log and<br>Smart Macro Finisher — in one page.</p>

      <div class="pills">
        <span class="pill">Free</span>
        <span class="pill">No sign-up</span>
        <span class="pill">Private</span>
      </div>
    </div>

    <!-- Same numbers as the landing page hero card (circumference 2π·42 ≈ 263.9) -->
    <div class="card">
      <div class="label">TODAY</div>
      <div class="kcal">1,742 <small>/ 2,166 kcal</small></div>
      <div class="rings">
        <div class="ring">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="none" stroke-width="10" stroke="#1e293b" />
            <circle cx="50" cy="50" r="42" fill="none" stroke-width="10" stroke-linecap="round" stroke="#6366f1" stroke-dasharray="263.9" stroke-dashoffset="36.8" />
          </svg>
          <div class="v">142g</div>
          <div class="n" style="color:#818cf8">Protein</div>
        </div>
        <div class="ring">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="none" stroke-width="10" stroke="#1e293b" />
            <circle cx="50" cy="50" r="42" fill="none" stroke-width="10" stroke-linecap="round" stroke="#10b981" stroke-dasharray="263.9" stroke-dashoffset="62.4" />
          </svg>
          <div class="v">168g</div>
          <div class="n" style="color:#34d399">Carbs</div>
        </div>
        <div class="ring">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="none" stroke-width="10" stroke="#1e293b" />
            <circle cx="50" cy="50" r="42" fill="none" stroke-width="10" stroke-linecap="round" stroke="#f43f5e" stroke-dasharray="263.9" stroke-dashoffset="60.3" />
          </svg>
          <div class="v">54g</div>
          <div class="n" style="color:#fb7185">Fat</div>
        </div>
      </div>
      <div class="water">
        <div class="row"><span>Hydration</span><b>2,250 / 3,000 ml</b></div>
        <div class="bar"><div></div></div>
      </div>
    </div>
  </div>
</body>
</html>
