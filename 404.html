<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — MacroPulse</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#020617" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Match the app's theme before first paint (app stores it in localStorage) -->
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('macropulse_app_state_v1') || 'null');
      if (saved && saved.theme === 'light') document.documentElement.classList.remove('dark');
    } catch (e) {}
  </script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind build output (npm run build:css). Root-relative so it loads at any missing path. -->
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    .glow {
      position: absolute;
      border-radius: 9999px;
      filter: blur(80px);
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Top Navigation -->
  <header class="sticky top-0 z-30 backdrop-blur-xl bg-white/80 dark:bg-slate-950/80 border-b border-slate-200/80 dark:border-slate-800/80">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
      <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-emerald-500 p-0.5 shadow-md shadow-indigo-500/20">
          <div class="w-full h-full bg-white dark:bg-slate-900 rounded-[10px] flex items-center justify-center">
            <svg class="w-5 h-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
        </div>
        <span class="font-bold text-lg tracking-tight">MacroPulse</span>
      </a>

      <a href="/app" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-sm shadow-indigo-500/20 transition">
        Open App
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>
      </a>
    </div>
  </header>

  <main class="relative flex-1 flex items-center">
    <div class="absolute inset-0 overflow-hidden" aria-hidden="true">
      <div class="glow w-96 h-96 bg-indigo-500/20 -top-20 -left-24"></div>
      <div class="glow w-96 h-96 bg-emerald-500/10 bottom-0 -right-24"></div>
    </div>

    <div class="relative w-full max-w-xl mx-auto px-4 sm:px-6 py-20 text-center">
      <!-- An empty macro ring: 0 of the page you wanted -->
      <div class="relative mx-auto w-44 h-44 sm:w-52 sm:h-52" aria-hidden="true">
        <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90">
          <circle cx="50" cy="50" r="42" fill="none" stroke-width="7" class="stroke-slate-200 dark:stroke-slate-800" />
          <circle cx="50" cy="50" r="42" fill="none" stroke-width="7" stroke-linecap="round" stroke="#6366f1"
            stroke-dasharray="263.9" stroke-dashoffset="263.9" />
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="font-mono text-5xl sm:text-6xl font-bold tracking-tight">404</span>
          <span class="mt-1 font-mono text-xs text-slate-500 dark:text-slate-400">0g found</span>
        </div>
      </div>

      <h1 class="mt-10 text-3xl sm:text-4xl font-extrabold tracking-tight">This page isn't on the menu</h1>
      <p class="mt-4 text-slate-600 dark:text-slate-400">
        The link may be broken, or the page may have moved. Your logged meals are safe — they live in your browser.
      </p>

      <div class="mt-9 flex flex-wrap items-center justify-center gap-3">
        <a href="/app" class="inline-flex items-center gap-2 px-6 py-3.5 rounded-2xl text-base font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-500/25 transition">
          Open MacroPulse
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>
        </a>
        <a href="/" class="inline-flex items-center px-6 py-3.5 rounded-2xl text-base font-semibold bg-white hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 transition">
          Back to home
        </a>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-200 dark:border-slate-800/80">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center text-xs text-slate-500 dark:text-slate-400">
      © <span id="year">2026</span> MacroPulse. Estimates only — not medical advice.
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
